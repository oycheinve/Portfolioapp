<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PWA: po dodaniu do ekranu głównego aplikacja otwiera się bez paska przeglądarki (display: standalone) -->
    <meta name="description" content="FinTrack – portfel inwestycyjny, notowania, dywidendy, cele FIRE, budżet i zadania." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="application-name" content="FinTrack" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FinTrack" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <title>FinTrack – portfel, budżet i zadania</title>
    <script>
      // Ustawienie motywu przed renderem, aby uniknąć mignięcia
      try {
        var s = JSON.parse(localStorage.getItem('wealth-app-state-v1') || '{}');
        // motyw: globalna podpowiedź (dane użytkownika są w jego przestrzeni u:<id>:…), inaczej ze stanu jak dotąd
        var t = localStorage.getItem('portfolio-theme') || (s.settings && s.settings.theme) || 'system';
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        if (t === 'pink') document.documentElement.classList.add('theme-pink');
      } catch (e) {}
      // Kolor paska stanu zgodny z motywem wybranym w aplikacji (także przy zmianie motywu w trakcie pracy)
      try {
        var syncThemeColor = function () {
          var cl = document.documentElement.classList;
          var c = cl.contains('dark') ? '#0a0a0a' : cl.contains('theme-pink') ? '#fdf2f6' : '#fafaf9';
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.setAttribute('content', c);
          });
        };
        syncThemeColor();
        new MutationObserver(syncThemeColor).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
